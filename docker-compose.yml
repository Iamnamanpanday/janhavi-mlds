services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    environment:
      ARTIFACT_DIR: /app/artifacts
      DATABASE_URL: sqlite:////app/data/scan_history.db
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - scan-data:/app/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    networks: [scanner]
  web:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [api]
    networks: [scanner]
volumes:
  scan-data:
networks:
  scanner:
    internal: true
